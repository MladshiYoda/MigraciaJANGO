{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Аэропорт Керимов{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="{% url 'home' %}" class="logo">✈ Аэропорт Керимов</a>
            <ul class="nav-links">
                <li><a href="{% url 'home' %}">Главная</a></li>
                
                <li class="dropdown">
                    <a href="{% url 'about' %}" class="dropbtn">Информация ▾</a>
                    <div class="dropdown-content">
                        <a href="{% url 'about' %}">О компании</a>
                        <a href="{% url 'contacts' %}">Контакты</a>
                        <a href="{% url 'how_to_find' %}">Как нас найти</a>
                    </div>
                </li>

                <li><a href="{% url 'page1' %}">Услуги</a></li>
                <li><a href="{% url 'page2' %}">Табло рейсов</a></li>
            </ul>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align: center; padding: 20px; background: #1e3c72; color: white; margin-top: 50px;">
        <p>&copy; 2026 Аэропорт Керимов. Все права защищены.</p>
        <p>Служба поддержки: +7 (800) 555-35-35</p>
    </footer>

</html>
