{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Аэропорт{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Шапка с навигацией -->
    <header>
        <nav class="navbar">
            <a href="{% url 'airline_list' %}" class="logo">
                ✈️ Аэропорт
            </a>
            <ul class="nav-links">
                <li><a href="{% url 'airline_list' %}">Авиакомпании</a></li>
                <li><a href="{% url 'airport_list' %}">Аэропорты</a></li>
                <li><a href="{% url 'flight_list' %}">Рейсы</a></li>
                <li><a href="{% url 'passenger_list' %}">Пассажиры</a></li>
                <li><a href="{% url 'ticket_list' %}">Билеты</a></li>
                <li><a href="/admin/">Админка</a></li>
            </ul>
        </nav>
    </header>

    <!-- Основной контент -->
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
