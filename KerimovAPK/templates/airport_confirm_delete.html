{% extends "base.html" %}

{% block title %}Удалить аэропорт{% endblock %}

{% block content %}
<h1>Удалить "{{ object.name }}"?</h1>

<div class="table-container" style="max-width: 600px;">
    <p>Вы уверены, что хотите удалить этот аэропорт?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:#dc3545;">Да, удалить</button>
        <a href="{% url 'airport_list' %}" class="btn" style="background:#666;">Отмена</a>
    </form>
</div>
{% endblock %}
