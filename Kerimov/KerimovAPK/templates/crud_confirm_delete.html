{% extends 'base.html' %}{% block title %}Удаление{% endblock %}{% block content %}<div class="eyebrow">{{ entity_title }}</div><h1>Удалить запись?</h1><div class="form-card"><p>Вы собираетесь удалить <strong>{{ object }}</strong>. Связанные записи также могут быть удалены по правилам базы данных.</p><form method="post">{% csrf_token %}<div class="button-row"><button type="submit" class="btn btn-danger">Да, удалить</button><a class="btn btn-muted" href="{% url entity_key|add:'_list' %}">Отмена</a></div></form></div>{% endblock %}
