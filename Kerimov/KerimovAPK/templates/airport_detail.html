{% extends "base.html" %}

{% block title %}{{ airport.name }}{% endblock %}

{% block content %}
<h1>{{ airport.name }} ({{ airport.city }})</h1>

<div class="card" style="max-width: 700px;">
    {% if airport.photo %}
        <img src="{{ airport.photo.url }}" alt="{{ airport.name }}" style="width: 400px; border-radius: 8px;">
    {% else %}
        <p>Фото нет</p>
    {% endif %}
    <br><br>
    <a href="{% url 'airport_update' airport.pk %}" class="btn" style="background:#fd7e14;">Редактировать</a>
    <a href="{% url 'airport_delete' airport.pk %}" class="btn" style="background:#dc3545;">Удалить</a>
    <a href="{% url 'airport_list' %}" class="btn">Назад к списку</a>
</div>
{% endblock %}
