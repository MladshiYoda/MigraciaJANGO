{% extends "base.html" %}

{% block title %}Удалить пассажира{% endblock %}

{% block content %}
<h1>Удалить пассажира "{{ object.first_name }} {{ object.last_name }}"?</h1>

<div class="table-container" style="max-width: 600px;">
    <p>Вы уверены?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:#dc3545;">Да, удалить</button>
        <a href="{% url 'passenger_list' %}" class="btn" style="background:#666;">Отмена</a>
    </form>
</div>
{% endblock %}
